services:
  - type: web
    name: fake-news-detection
    runtime: python
    buildCommand: pip install -r requirements.txt && python train_model.py --no-tune
    startCommand: gunicorn app:app -c gunicorn.conf.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_NEWS_CHARS
        value: 12000
